<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Test de la Switch</title>
<style>
body{margin:0;background:#1f5b3a;color:#1d2b22;font:18px "Trebuchet MS",sans-serif}
.wrap{max-width:1240px;margin:0 auto;padding:10px 16px}
h1{color:#fff7e6;font-size:26px;margin:2px 0 6px}
.top{display:-webkit-box;display:flex;-webkit-box-align:center;align-items:center;-webkit-box-pack:justify;justify-content:space-between}
.go{background:#ffb238;border:4px solid #1d2b22;border-radius:18px;font:bold 24px "Trebuchet MS",sans-serif;padding:8px 20px;cursor:pointer}
.grid{display:-webkit-box;display:flex;-webkit-flex-wrap:wrap;flex-wrap:wrap}
.box{background:#fff7e6;border:3px solid #1d2b22;border-radius:14px;padding:8px 12px;margin:0 8px 8px 0;width:296px;box-sizing:border-box}
.box b{display:block;font-size:16px;margin-bottom:4px}
.ok{color:#1f7a3a;font-weight:bold}.no{color:#b3261e;font-weight:bold}
.small{font-size:13px;word-break:break-all}
button{font:bold 17px "Trebuchet MS",sans-serif;border:3px solid #1d2b22;border-radius:12px;background:#fff;padding:4px 10px;margin:4px 4px 0 0;cursor:pointer}
.ask{font-size:28px;font-weight:bold;color:#b3261e}
.wide{width:600px}
table{border-collapse:collapse;font-size:14px}
td{border:1px solid #c9bfa6;padding:1px 6px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><h1>Dino Explorateur : test de la Switch n° 2</h1><button class="go" id="go">Lancer le jeu</button></div>
  <div class="grid">
    <div class="box wide"><b>Boutons, un par un</b><span class="ask" id="ask"></span> <button id="skip">Rien ne se passe</button><br><table id="map"></table></div>
    <div class="box"><b>Sauvegarde</b><span id="store">...</span></div>
    <div class="box"><b>Fichiers son</b><span id="fmt">...</span><br><button id="play">Jouer un son</button><br><span id="audio"></span></div>
    <div class="box"><b>Écran tactile</b><span id="touch">touche l'écran</span></div>
    <div class="box"><b>Fluidité</b><span id="fps">...</span></div>
    <div class="box wide"><b>Moteur web</b><span class="small" id="ua"></span></div>
  </div>
</div>
<script>
(function () {
  function $(id) { return document.getElementById(id); }
  function yes(t) { return '<span class="ok">' + t + '</span>'; }
  function no(t) { return '<span class="no">' + t + '</span>'; }
  $('go').onclick = function () { location.href = 'index.html'; };
  $('ua').innerHTML = navigator.userAgent + '<br>Écran ' + window.innerWidth + ' x ' + window.innerHeight + ', window.nx : ' + typeof window.nx;

  // Boutons, un par un : ce que chaque bouton envoie à la page (touche du clavier, clic ou manette)
  var ASK = ['A', 'B', 'X', 'Y', 'croix en haut', 'croix en bas', 'croix à gauche', 'croix à droite', 'L', 'R', 'ZL', 'ZR', '+', '−', 'stick gauche vers la droite', 'stick droit vers la droite'];
  var step = 0, rows = [], lastPad = '';
  function showAsk() {
    $('ask').innerHTML = step < ASK.length ? 'Appuie sur ' + ASK[step] : yes('fini, merci !');
    $('skip').style.display = step < ASK.length ? '' : 'none';
    var h = '';
    for (var i = 0; i < rows.length; i += 2) h += '<tr><td>' + rows[i] + '</td><td>' + (rows[i + 1] || '') + '</td></tr>';
    $('map').innerHTML = h;
  }
  function got(what) {
    if (step >= ASK.length) return;
    rows.push('<b>' + ASK[step] + '</b> : ' + what); step++; showAsk();
  }
  $('skip').onclick = function (e) { e.stopPropagation(); got('<span class="no">rien</span>'); };
  document.addEventListener('keydown', function (e) { e.preventDefault(); got('touche ' + (e.key || '?') + ' / ' + (e.code || '?') + ' / ' + e.keyCode); });
  document.addEventListener('click', function (e) { if (e.target.tagName !== 'BUTTON') got('clic'); });
  showAsk();
  function pollPads() {
    if (!navigator.getGamepads) return;
    var pads = navigator.getGamepads();
    for (var i = 0; i < pads.length; i++) {
      var p = pads[i]; if (!p) continue;
      for (var j = 0; j < p.buttons.length; j++) if (p.buttons[j].pressed) { var k = 'manette bouton ' + j; if (k !== lastPad) { lastPad = k; got(k); } return; }
      for (var a = 0; a < p.axes.length; a++) if (Math.abs(p.axes[a]) > .6) { var k2 = 'manette axe ' + a + (p.axes[a] > 0 ? ' +' : ' -'); if (k2 !== lastPad) { lastPad = k2; got(k2); } return; }
    }
    lastPad = '';
  }

  // Tactile
  ['touchstart', 'mousedown'].forEach(function (t) { document.addEventListener(t, function (e) { var p = e.touches && e.touches[0] ? e.touches[0] : e; $('touch').innerHTML = yes(e.type + ' en ' + Math.round(p.clientX) + ', ' + Math.round(p.clientY)); }); });

  // Fichiers son : formats acceptés, puis un vrai son joué avec la balise audio
  var A = document.createElement('audio'), fmts = [['wav', 'audio/wav'], ['mp3', 'audio/mpeg'], ['m4a', 'audio/mp4'], ['ogg', 'audio/ogg']], f = [];
  for (var i = 0; i < fmts.length; i++) { var c = A.canPlayType ? A.canPlayType(fmts[i][1]) : ''; f.push((c ? yes : no)(fmts[i][0] + (c ? ' (' + c + ')' : ''))); }
  $('fmt').innerHTML = 'Formats : ' + f.join(', ');
  var snd = null;
  $('play').onclick = function (e) {
    e.stopPropagation();
    try {
      snd = new Audio('bip.wav');
      ['playing', 'ended', 'error', 'stalled'].forEach(function (t) { snd.addEventListener(t, function () { $('audio').innerHTML = (t === 'error' || t === 'stalled' ? no : yes)(t + (snd.error ? ' code ' + snd.error.code : '')); }); });
      var p = snd.play();
      if (p && p.then) p.then(function () { $('audio').innerHTML = yes('lecture lancée'); }, function (err) { $('audio').innerHTML = no('refusé : ' + (err && err.name)); });
      else $('audio').innerHTML = 'demandé...';
    } catch (err) { $('audio').innerHTML = no('erreur : ' + err.message); }
  };

  // Sauvegarde : toutes les façons possibles, et le pont vers la carte SD (window.nx)
  var st = [];
  function tryStore(name, fn) { try { fn(); st.push(yes(name)); } catch (e) { st.push(no(name + ' (' + (e.name || e.message) + ')')); } }
  tryStore('localStorage', function () { localStorage.setItem('t', '1'); });
  tryStore('sessionStorage', function () { sessionStorage.setItem('t', '1'); });
  tryStore('cookie', function () { document.cookie = 't=1'; if (document.cookie.indexOf('t=1') < 0) throw new Error('ignoré'); });
  st.push(window.indexedDB ? yes('indexedDB présent') : no('indexedDB'));
  var sd = 'carte SD : ' + (window.nx ? 'connexion...' : no('pas de window.nx'));
  function showStore() { $('store').innerHTML = st.join(', ') + '<br>' + sd; }
  showStore();
  if (window.nx) {
    var parts = '', asked = false;
    window.nx.addEventListener('message', function (e) {
      var m = String(e.data).replace(/\u0000+$/, '');
      if (m === 'ping') return;
      if (m.indexOf('load-part:') === 0) { parts += m.slice(10); return; }
      if (m === 'load-end') {
        var n = (parseInt(parts, 10) || 0) + 1;
        sd = 'carte SD : ' + yes('lancement n° ' + n) + '<br><span class="small">Relance l’appli : si le nombre augmente, la sauvegarde marche.</span>';
        showStore();
        window.nx.sendMessage('save-begin'); window.nx.sendMessage('save-part:' + n); window.nx.sendMessage('save-end');
        return;
      }
      if (m === 'saved') { sd += '<br>' + yes('enregistré'); showStore(); }
      if (m === 'save-error') { sd += '<br>' + no('erreur d’écriture'); showStore(); }
    });
    var ask = function () { if (!asked) asked = window.nx.sendMessage('load'); if (!asked) setTimeout(ask, 50); };
    ask();
  }

  // Fluidité
  var frames = 0, t0 = Date.now();
  function loop() {
    frames++;
    var t = Date.now();
    if (t - t0 >= 1000) { var fps = Math.round(frames * 1000 / (t - t0)); $('fps').innerHTML = (fps >= 50 ? yes : no)(fps + ' images par seconde'); frames = 0; t0 = t; }
    pollPads();
    (window.requestAnimationFrame || function (cb) { setTimeout(cb, 16); })(loop);
  }
  loop();
}());
</script>
</body>
</html>
